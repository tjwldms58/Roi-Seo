# 수면 레포트 섹션 규칙
# 문장과 수치는 로직 엑셀(S3~S7 수식)이 만듭니다.
# 이 파일은 어떤 페이지를 어떤 입력에 묶을지, 비었을 때 빼 낼지만 정합니다.
# 항목 이름은 S1 4행·S4 4행 머리글과 같아야 합니다. 개수는 적혀 있지 않습니다.

version: "19차"
updated_at: "2026-09-23"

document:
  title: "불면 중심 수면 리듬 진단 리포트"
  subtitle: "웨어러블 원본으로 계산한 수면 리듬 요약"
  brand: "HEALMARU CARE"
  running_title: "수면 리듬 진단 리포트"
  missing_text: "해당 데이터 없음"
  footer_note: "데이터 기반 참고 리포트 · 의료 진단 아님"

empty_tokens:
  - ""
  - "nan"
  - "none"
  - "null"
  - "n/a"
  - "na"
  - "-"
  - "—"
  - "없음"
  - "해당없음"
  - "해당 없음"

# 하루를 '측정됨'으로 볼 때 필요한 S1 머리글. 하나라도 비면 그 날은 계산에서 빠집니다.
monitor_headers:
  - "취침시각"
  - "기상시각"
  - "깊은수면_분"

# S7에 있는 페이지. core_headers가 모두 비어 있으면 그 페이지를 생략합니다.
# chart_header는 S4 머리글입니다. 없으면 차트만 그리지 않습니다.
# layout 은 원본 리포트의 페이지 형태입니다. question 은 페이지 큰 제목이고, 문장은 엑셀이 만듭니다.
# ref 는 S3 기준(se, sol, awake, hr, rr, spo2)입니다. tone: min 은 기준 이상이면 안정, max 는 기준 이하면 안정, band 는 하한~상한.
sections:
  - page: "03"
    layout: stacked
    question: "이번 주, 얼마나 잤나요"
    chart_header: "총수면시간_TST_분"
    unit: "분"
    core_headers: ["깊은수면_분", "얕은수면_분", "렘수면_분"]
  - page: "04"
    layout: bars
    question: "침대에 있던 시간 중 실제로 잔 비율"
    ref: se
    tone: min
    chart_header: "수면효율_최종_%(리포트 반영값, 19차)"
    unit: "%"
    core_headers: ["취침시각", "기상시각", "깊은수면_분"]
  - page: "05"
    layout: bars
    question: "잠들기까지 걸린 시간"
    ref: sol
    tone: max
    chart_header: "입면잠복기_SOL_분"
    unit: "분"
    core_headers: ["입면잠복기_분(SOL)"]
  - page: "06"
    layout: bars
    question: "밤사이 깬 횟수"
    ref: awake
    tone: max
    chart_header: "각성횟수"
    unit: "회"
    core_headers: ["각성횟수_회"]
  - page: "06+"
    layout: bars
    question: "한 번 깨면 얼마나 깨어 있나요"
    chart_header: "평균각성지속시간_분(1회당)"
    unit: "분"
    core_headers: ["각성시간_실측_분(기기값,선택)"]
  - page: "07"
    layout: quad
    question: "잠들기, 효율, 각성을 같이 보면"
    chart_header: "수면효율_최종_%(리포트 반영값, 19차)"
    unit: "%"
    core_headers: ["입면잠복기_분(SOL)", "각성횟수_회"]
  - page: "08"
    layout: bars
    question: "수면 중 심장 박동"
    ref: hr
    tone: band
    chart_header: "심박수_HR"
    unit: "bpm"
    core_headers: ["심박수_평균_bpm"]
  - page: "09"
    layout: bars
    question: "수면 중 호흡"
    ref: rr
    tone: band
    chart_header: "호흡수_RR"
    unit: "회/분"
    core_headers: ["호흡수_평균_회/분"]
  - page: "10"
    layout: bars
    question: "수면 중 산소포화도"
    ref: spo2
    tone: min
    chart_header: "SpO2_평균"
    unit: "%"
    core_headers: ["SpO2_평균_%"]
  - page: "11"
    layout: clock
    question: "자고 일어나는 시각은 고른가요"
    chart_header: "취침시각_분환산"
    unit: "분"
    core_headers: ["취침시각", "기상시각"]
  - page: "12"
    layout: compare
    question: "가장 잘 잔 밤, 가장 힘든 밤"
    title: "좋았던 밤과 힘들었던 밤"
    core_headers: ["취침시각", "기상시각", "깊은수면_분"]
  - page: "13"
    layout: bars
    question: "낮 동안 얼마나 움직였나요"
    chart_header: "활동시간_분"
    unit: "분"
    core_headers: ["활동시간_분"]
  - page: "14"
    layout: calories
    question: "활동과 함께 본 에너지"
    chart_header: "소모칼로리_기기값"
    unit: "kcal"
    core_headers: ["소모칼로리_기기값_kcal(선택)"]
  - page: "15"
    layout: bars
    question: "활력점수는 어디로 움직였나요"
    chart_header: "활력점수_기기값"
    unit: "점"
    core_headers: ["활력점수_기기값(0~100)"]
  - page: "16"
    layout: diagnosis
    question: "이번 주를 이렇게 읽습니다"
    core_headers: ["깊은수면_분", "입면잠복기_분(SOL)", "각성횟수_회"]
  - page: "17"
    layout: signals
    question: "평소와 달랐던 밤"
    core_headers: ["심박수_평균_bpm", "호흡수_평균_회/분", "SpO2_평균_%"]
  - page: "18"
    layout: routine
    question: "다음 주를 위한 세 가지"
    core_headers: ["취침시각", "활동시간_분"]
